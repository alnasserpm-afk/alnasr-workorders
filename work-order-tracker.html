<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#18161d">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<title>متابعة أوامر العمل — مطبعة النصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#18161d;
    --paper:#e9e6dd;
    --card:#fbf9f4;
    --press:#c31f3c;
    --cyan:#00aeef;
    --magenta:#e31c79;
    --yellow:#f2bf00;
    --key:#161616;
    --plastic:#2a63c9;
    --plastic-lt:#7fa8e8;
    --line:rgba(20,18,14,0.16);
    --muted:#726f68;
    --good:#2f7a52;
    --warn:#c31f3c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header.topbar{
    background:var(--ink);color:#f4f1ea;padding:20px 24px;display:flex;align-items:center;
    justify-content:space-between;gap:14px;border-bottom:4px solid var(--press);flex-wrap:wrap;
    position:relative;overflow:hidden;
  }
  header.topbar::before{
    content:'';position:absolute;left:-40px;top:50%;transform:translateY(-50%);
    width:170px;height:170px;pointer-events:none;
    background:
      radial-gradient(circle, transparent 0 45px, rgba(244,241,234,.05) 46px 47px, transparent 48px),
      radial-gradient(circle, transparent 0 14px, rgba(244,241,234,.07) 15px 16px, transparent 17px);
  }
  .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
  .brand h1{font-size:20px;font-weight:800;margin:0;letter-spacing:.3px;}
  .brand .sub{font-size:11px;color:#b9b5aa;font-family:'JetBrains Mono',monospace;letter-spacing:.4px;margin-top:2px;}
  .regmark{width:34px;height:34px;flex-shrink:0;}
  .section-title{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);
    margin:0 0 12px;letter-spacing:.2px;
  }
  .section-title::before{
    content:'';width:11px;height:11px;flex-shrink:0;
    background:
      linear-gradient(var(--press),var(--press)) center/1.4px 100% no-repeat,
      linear-gradient(90deg,var(--press),var(--press)) center/100% 1.4px no-repeat;
  }
  .actor-field{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfcbc0;}
  .actor-field input{
    background:#252230;border:1px solid #3a3646;color:#f4f1ea;border-radius:6px;padding:6px 10px;
    font-family:'Tajawal',sans-serif;font-size:13px;width:140px;
  }
  nav.tabs{display:flex;gap:2px;padding:10px 20px 0;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  nav.tabs button{
    background:transparent;border:none;padding:10px 18px;font-family:'Tajawal',sans-serif;
    font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--press);}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  .cmyk-dots{display:flex;gap:5px;align-items:center;}
  .cmyk-dots span{width:9px;height:9px;border-radius:50%;background:#d8d4c8;display:inline-block;}
  .cmyk-dots span.on-cyan{background:var(--cyan);}
  .cmyk-dots span.on-magenta{background:var(--magenta);}
  .cmyk-dots span.on-yellow{background:var(--yellow);}
  .cmyk-dots span.on-key{background:var(--key);}
  .cmyk-dots span.on-gray{background:var(--muted);}
  .cmyk-dots span.on-plastic{background:var(--plastic);}

  #empty{text-align:center;padding:70px 20px;color:var(--muted);}
  #empty::before{content:'📋';display:block;font-size:42px;margin-bottom:12px;opacity:.5;}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;}
  .filter-row button{
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px;
    font-family:'Tajawal',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);
  }
  .filter-row button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;
    transition:box-shadow .18s, transform .12s;position:relative;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,18,14,.06), 0 1px 2px rgba(20,18,14,.04);
  }
  .card::after{
    content:'';position:absolute;top:10px;left:10px;width:9px;height:9px;pointer-events:none;
    background:
      linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,
      linear-gradient(90deg,var(--line),var(--line)) center/100% 1px no-repeat;
    opacity:.7;
  }
  .card:hover{box-shadow:0 8px 24px rgba(20,18,14,.12);transform:translateY(-2px);}
  .card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--yellow),var(--key));}
  .card.plastic::before{background:linear-gradient(90deg,var(--plastic-lt),var(--plastic));}
  .card .orderno{font-size:10.5px;color:var(--muted);letter-spacing:.6px;display:flex;align-items:center;gap:6px;font-weight:600;}
  .type-badge{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:10px;background:var(--press);color:#fff;letter-spacing:.3px;}
  .type-badge.plastic{background:var(--plastic);}
  .card .client{font-size:17.5px;font-weight:800;margin:6px 0 3px;letter-spacing:.1px;line-height:1.25;}
  .card .work{font-size:13px;color:#54514a;margin-bottom:12px;}
  .status-pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;background:#eee;color:#333;}
  .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);}
  .overdue-badge{background:var(--warn);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;}

  .section{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden;}
  .section h3{background:var(--press);color:#fff;margin:0;padding:9px 14px;font-size:13px;font-weight:800;}
  .section.plastic-section h3{background:var(--plastic);}
  .section .body{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;font-weight:700;color:#3a3833;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=datetime-local],.field select,.field textarea{
    font-family:'Tajawal',sans-serif;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:4px;background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:44px;}
  .choice-row{display:flex;gap:14px;flex-wrap:wrap;}
  .choice-row label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:#333;cursor:pointer;}
  .btn{font-family:'Tajawal',sans-serif;font-weight:700;font-size:13px;border:none;border-radius:4px;padding:10px 20px;cursor:pointer;}
  .btn-primary{background:var(--press);color:#fff;}
  .btn-primary:hover{background:#a5192f;}
  .btn-primary.plastic{background:var(--plastic);}
  .btn-primary.plastic:hover{background:#204d9e;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{background:#f0ede4;}
  .btn-small{padding:5px 12px;font-size:12px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}

  .type-toggle{display:flex;gap:10px;margin-bottom:16px;}
  .type-toggle button{
    flex:1;padding:16px;border-radius:6px;border:2px solid var(--line);background:var(--card);
    font-family:'Tajawal',sans-serif;font-weight:800;font-size:14px;cursor:pointer;color:var(--muted);
  }
  .type-toggle button.sel-paper.active{border-color:var(--press);color:var(--press);background:#fdeceb;}
  .type-toggle button.sel-plastic.active{border-color:var(--plastic);color:var(--plastic);background:#eaf0fc;}

  .items-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .items-table th{background:#efece3;padding:6px 8px;font-size:11px;font-weight:800;text-align:center;border:1px solid var(--line);}
  .items-table td{padding:4px;border:1px solid var(--line);}
  .items-table input,.items-table select{width:100%;border:none;padding:6px 4px;font-family:'Tajawal',sans-serif;font-size:12.5px;background:transparent;}
  .items-table .rm{background:none;border:none;color:var(--warn);cursor:pointer;font-weight:800;font-size:14px;}
  .add-row-btn{margin-top:8px;}

  .img-drop{
    border:2px dashed var(--line);border-radius:6px;padding:14px;text-align:center;cursor:pointer;
    background:#fff;font-size:12.5px;color:var(--muted);
  }
  .img-drop img{max-width:100%;max-height:220px;border-radius:4px;margin-top:8px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,13,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;animation:fadeIn .18s ease;}
  .modal{background:var(--card);border-radius:14px;max-width:760px;width:100%;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:slideUp .22s cubic-bezier(.2,.8,.2,1);}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .modal-head{background:var(--ink);color:#f4f1ea;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;}
  .modal-head .x{background:none;border:none;color:#cfcbc0;font-size:20px;cursor:pointer;line-height:1;}
  .modal-body{padding:18px 20px;max-height:75vh;overflow-y:auto;}
  .pipeline{display:flex;align-items:center;gap:6px;margin:10px 0 18px;flex-wrap:wrap;}
  .pipeline .stage{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:#eee;color:#666;}
  .pipeline .stage.done{background:var(--good);color:#fff;}
  .pipeline .stage.current{background:var(--press);color:#fff;}
  .pipeline .stage.current.plastic{background:var(--plastic);}
  .pipeline .arrow{color:var(--muted);font-size:12px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;font-size:13px;}
  .detail-grid div.pair{display:flex;flex-direction:column;gap:3px;border-bottom:1px dashed var(--line);padding:5px 0;}
  .detail-grid .k{color:var(--muted);font-size:11px;order:-1;}
  .detail-grid .pair bdi{font-weight:700;word-break:break-word;}
  .history{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .history h4{margin:0 0 8px;font-size:13px;}
  .history-item{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid #f0ede4;}
  .history-item .ts{font-family:'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap;font-size:11px;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;}
  .note-row{display:flex;gap:8px;margin-top:10px;}
  .note-row input{flex:1;font-family:'Tajawal',sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:700;z-index:100;opacity:0;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .required-star{color:var(--press);}
  .hint{font-size:11px;color:var(--muted);margin-top:2px;}

  table.log-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);}
  table.log-table th{background:var(--ink);color:#f4f1ea;padding:8px;font-size:11px;text-align:center;}
  table.log-table td{padding:8px;border-bottom:1px solid var(--line);text-align:center;}
  table.log-table tr:hover{background:#f5f2ea;}
  .worktype-tag{display:inline-block;background:#eee;border-radius:12px;padding:1px 8px;font-size:10.5px;font-weight:700;margin:1px;}
  .login-overlay{
    position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;
    z-index:999;padding:20px;overflow:hidden;
  }
  .login-overlay::before{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:520px;height:520px;border-radius:50%;
    border:1.5px solid rgba(244,241,234,.06);
  }
  .login-overlay::after{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:520px;height:520px;
    background:
      linear-gradient(rgba(244,241,234,.05),rgba(244,241,234,.05)) center/1.5px 100% no-repeat,
      linear-gradient(90deg,rgba(244,241,234,.05),rgba(244,241,234,.05)) center/100% 1.5px no-repeat;
  }
  .login-box{
    background:var(--card);border-radius:10px;padding:32px 28px;width:100%;max-width:350px;
    box-shadow:0 24px 70px rgba(0,0,0,.4);border-top:4px solid var(--press);position:relative;z-index:1;
  }
  .login-box h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:.2px;}
  .login-box .sub{font-size:11.5px;color:var(--muted);margin-bottom:20px;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;}
  .login-box label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:16px 0 7px;letter-spacing:.3px;}
  .login-box select, .login-box input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:6px;
    font-family:'Tajawal',sans-serif;font-size:14px;background:#fff;
  }
  .login-box button{
    width:100%;margin-top:22px;padding:13px;background:var(--press);color:#fff;border:none;
    border-radius:6px;font-family:'Tajawal',sans-serif;font-size:14.5px;font-weight:800;cursor:pointer;
    letter-spacing:.2px;transition:opacity .15s;
  }
  .login-box button:active{opacity:.85;}
  .login-box .err{color:var(--warn);font-size:12.5px;margin-top:10px;display:none;}
  .pin-display{
    display:flex;justify-content:center;gap:14px;margin:8px 0 4px;padding:14px 0;
    background:#fff;border:1px solid var(--line);border-radius:5px;
  }
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff;}
  .pin-dot.filled{background:var(--press);border-color:var(--press);}
  .pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .pin-keypad button{
    padding:14px 0;font-size:19px;font-weight:800;border:1px solid var(--line);border-radius:6px;
    background:#fff;font-family:'JetBrains Mono',monospace;cursor:pointer;color:var(--ink);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .pin-keypad button:active{background:var(--paper);}
  .pin-keypad .pin-clear, .pin-keypad .pin-back{
    font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--warn);
  }
  .user-field{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#e7e3d8;}
  .user-field .logout-link{color:#b9b5aa;cursor:pointer;text-decoration:underline;font-size:11.5px;}
  .install-btn{
    background:var(--press);color:#fff;border:none;padding:6px 12px;border-radius:20px;
    font-family:'Tajawal',sans-serif;font-size:11.5px;font-weight:700;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .install-btn:active{opacity:.85;}
  .emp-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:5px;margin-bottom:8px;
  }
  .emp-row.inactive{opacity:.5;}
  .emp-row .emp-name{font-weight:800;font-size:14px;}
  .emp-row .emp-role{font-size:11.5px;color:var(--muted);margin-right:8px;}
  .emp-row-actions{display:flex;gap:6px;flex-shrink:0;}
  .emp-row-editing{
    flex-direction:column;align-items:stretch;gap:10px;background:#fff;
    border-color:var(--press);
  }
  .emp-edit-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .emp-edit-fields input, .emp-edit-fields select{
    padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-family:'Tajawal',sans-serif;font-size:13px;
    width:100%;min-width:0;
  }
  .emp-edit-actions{display:flex;gap:8px;justify-content:flex-end;}
  @media (max-width:640px){
    .emp-edit-fields{grid-template-columns:1fr;}
  }
  .add-emp-box{
    background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:20px;
  }
  html, body{ overflow-x:hidden; max-width:100vw; }
  .add-emp-box .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
  .add-emp-box input, .add-emp-box select{
    padding:9px 10px;border:1px solid var(--line);border-radius:5px;font-family:'Tajawal',sans-serif;font-size:13.5px;
    width:100%; min-width:0;
  }
  @media (max-width:640px){
    .add-emp-box .row3{grid-template-columns:1fr;}
  }

  /* ---------- تحسينات شكل الموبايل / تطبيق ---------- */
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:50;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  nav.tabs{
    position:sticky;top:0;z-index:40;
  }
  @media (display-mode: standalone){
    header{ padding-top:calc(18px + env(safe-area-inset-top)); }
  }
  .card{ -webkit-tap-highlight-color:transparent; }
  .card:active{ transform:scale(0.98); transition:transform .08s; }
  button, .btn{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

  /* ---------- شريط أدوات الداشبورد: بحث + فلاتر + تصدير ---------- */
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .toolbar input[type="text"]{
    flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line); border-radius:5px;
    font-family:'Tajawal',sans-serif; font-size:13.5px;
  }
  .toolbar select{
    padding:9px 10px; border:1px solid var(--line); border-radius:5px;
    font-family:'Tajawal',sans-serif; font-size:13px; background:#fff;
  }
  .toolbar .btn-export{
    padding:9px 14px; border-radius:5px; border:1px solid var(--line); background:#fff;
    font-family:'Tajawal',sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .toolbar .btn-export:active{ background:var(--paper); }

  /* ---------- منطقة الطباعة (مخفية على الشاشة، تظهر عند الطباعة فقط) ---------- */
  #printArea{ display:none; }
  @media print{
    header, nav.tabs, .toolbar, .filter-row, #loginOverlay{ display:none !important; }
    #dashboardView > .grid{ display:none !important; }
    #printArea{ display:block !important; }
    #printArea table{ width:100%; border-collapse:collapse; font-family:'Tajawal',sans-serif; }
    #printArea th, #printArea td{ border:1px solid #999; padding:6px 8px; font-size:11px; text-align:right; }
    #printArea th{ background:#eee; }
    #printArea h2{ font-family:'Tajawal',sans-serif; margin-bottom:4px; }
  }

  /* ---------- أفاتار المستخدم ---------- */
  .avatar-circle{
    width:26px;height:26px;border-radius:50%;background:var(--press);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;
  }

  /* ---------- شريط تنقل سفلي (موبايل) ---------- */
  .bottom-nav{
    display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;
    background:var(--card);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(0,0,0,.06);
  }
  .bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;}
  .bottom-nav button{
    background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:4px 10px;font-family:'Tajawal',sans-serif;font-size:10.5px;font-weight:700;color:var(--muted);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }

function toRow(map, obj){
  const row = {};
  for(const [jsKey, dbKey] of Object.entries(map)){
    let v = obj[jsKey];
    row[dbKey] = (v === undefined) ? null : v;
  }
  if(obj.id !== undefined) row.id = obj.id;
  if('history' in obj) row.history = obj.history || [];
  return row;
}
function fromRow(map, row){
  const obj = {};
  for(const [jsKey, dbKey] of Object.entries(map)){
    obj[jsKey] = row[dbKey];
  }
  if('colors' in obj && !obj.colors) obj.colors = [];
  if('finishing' in obj && !obj.finishing) obj.finishing = [];
  if('items' in obj && !obj.items) obj.items = [];
  if('caps' in obj && !obj.caps) obj.caps = [];
  if('workType' in obj && !obj.workType) obj.workType = [];
  return obj;
}

function escapeHtml(str){

}

async function handleLogin(){
  const id = Number(document.getElementById('loginEmployeeSelect').value);

  if(!emp || emp.pin !== pinValue){

  errBox.style.display = 'none';

async function loadOrders(){
  try{
    const [{data:paperRows, error:pErr}, {data:plasticRows, error:plErr}] = await Promise.all([
      supabaseClient.from('paper_orders').select('*'),
      supabaseClient.from('plastic_orders').select('*')
    ]);
    if(pErr) throw pErr;
    if(plErr) throw plErr;
    const paperOrders = (paperRows||[]).map(r => ({...fromRow(PAPER_MAP, r), id:r.id, type:'paper', history:r.history||[]}));
    const plasticOrders = (plasticRows||[]).map(r => ({...fromRow(PLASTIC_MAP, r), id:r.id, type:'plastic', history:r.history||[]}));
    ORDERS = [...paperOrders, ...plasticOrders];
  }catch(e){ ORDERS = []; showToast('تعذر تحميل الأوامر: ' + e.message); }
}
async function saveOrders(){
  try{
    const paperRows = ORDERS.filter(o=>o.type==='paper').map(o=>toRow(PAPER_MAP, o));
    const plasticRows = ORDERS.filter(o=>o.type==='plastic').map(o=>toRow(PLASTIC_MAP, o));
    if(paperRows.length){
      const {error} = await supabaseClient.from('paper_orders').upsert(paperRows, {onConflict:'id'});
      if(error) throw error;
    }
    if(plasticRows.length){
      const {error} = await supabaseClient.from('plastic_orders').upsert(plasticRows, {onConflict:'id'});
      if(error) throw error;
    }
  }catch(e){ showToast('خطأ في الحفظ: ' + e.message); }
}
async function loadDaily(){
  try{
    const {data, error} = await supabaseClient.from('plastic_daily_log').select('*');

  }catch(e){ DAILY = []; showToast('تعذر تحميل سجلات المتابعة: ' + e.message); }
}
async function saveDaily(){

}

function startEmployeeEdit(id){

  renderEmployeeList();
}

async function saveEmployeeEdit(id){
  const name = document.getElementById(`editName_${id}`).value.trim();
  const pin = document.getElementById(`editPin_${id}`).value.trim();
  const role = document.getElementById(`editRole_${id}`).value;
  if(!name || !pin){ showToast('الاسم والرمز مطلوبان'); return; }
  try{
    const {error} = await supabaseClient.from('employees').update({name, pin, role}).eq('id', id);
    if(error) throw error;
    const emp = EMPLOYEES.find(e=>e.id===id);
    if(emp){ emp.name = name; emp.pin = pin; emp.role = role; }
    editingEmployeeId = null;
    renderEmployeeList();
    showToast('تم تحديث بيانات الموظف');
    if(CURRENT_USER && CURRENT_USER.id === id){
      CURRENT_USER.name = name; CURRENT_USER.role = role;
      document.getElementById('userNameDisplay').textContent = name;
      document.getElementById('userAvatar').textContent = name.trim().charAt(0).toUpperCase();
    }
  }catch(e){ showToast('خطأ: ' + e.message); }
}
async function addEmployee(){
  const name = document.getElementById('newEmpName').value.trim();
  const pin = document.getElementById('newEmpPin').value.trim();
  const role = document.getElementById('newEmpRole').value;
  if(!name || !pin){ showToast('الاسم والرمز مطلوبان'); return; }
  try{
    const {data, error} = await supabaseClient.from('employees').insert({name, pin, role, active:true}).select().single();
    if(error) throw error;
    EMPLOYEES.push(data);
    document.getElementById('newEmpName').value = '';
    document.getElementById('newEmpPin').value = '';
    renderEmployeeList();
    showToast('تم إضافة الموظف');
  }catch(e){ showToast('خطأ: ' + e.message); }
}
async function toggleEmployeeActive(id){
  const emp = EMPLOYEES.find(e=>e.id===id);
  if(!emp) return;
  try{
    const {error} = await supabaseClient.from('employees').update({active: !emp.active}).eq('id', id);
    if(error) throw error;
    emp.active = !emp.active;
    renderEmployeeList();
  }catch(e){ showToast('خطأ: ' + e.message); }
}

function isOverdue(order){

  if(order.status === 'تم التسليم') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(order.deliveryDate);
  return dd < today;
}

function allStatusOptions(){
  const seen = new Map();
  [...STAGES_PAPER, ...STAGES_PLASTIC].forEach(s => { if(!seen.has(s.key)) seen.set(s.key, s.label); });

}

  if(!term) return true;
  const hay = [o.clientName, o.workName, orderLabel(o), o.notes, o.generalNote].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(term.toLowerCase());
}

function renderDashboardResultsOnly(){
  // إعادة بناء نتائج الكروت فقط بدون لمس خانة البحث نفسها (تحافظ على تركيز الكيبورد)
  const wasFocused = document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.closest('.toolbar');
  const cursorPos = wasFocused ? document.activeElement.selectionStart : null;
  renderDashboard();
  if(wasFocused){
    const input = document.querySelector('.toolbar input[type="text"]');
    if(input){
      input.focus();
      if(cursorPos !== null) input.setSelectionRange(cursorPos, cursorPos);
    }
  }
}
function setDashStatus(v){ dashSearch = document.querySelector('.toolbar input[type="text"]').value; dashStatusFilter = v; renderDashboard(); }

function getFilteredOrders(){
  return ORDERS.filter(o =>
    (dashFilter==='all' || o.type===dashFilter) &&
    (dashStatusFilter==='all' || o.status===dashStatusFilter) &&
    matchesSearch(o, dashSearch)
  );
}

function exportExcel(){
  const rows = getFilteredOrders().map(o => ({
    'الرقم': orderLabel(o),
    'النوع': o.type==='plastic' ? 'بلاستيك' : 'ورقي',
    'العميل': o.clientName||'',
    'الشغلانة': o.workName||'',
    'الكمية': o.quantity||'',
    'الحالة': o.status||'',
    'تاريخ التسليم': o.deliveryDate||'',
    'متأخر؟': isOverdue(o) ? 'نعم' : 'لا',
    'متوقف؟': o.paused ? 'نعم' : 'لا'
  }));
  if(!rows.length){ showToast('لا توجد بيانات لتصديرها'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'أوامر العمل');
  XLSX.writeFile(wb, `اوامر-العمل-${nowStamp().replace(/[\/: ]/g,'-')}.xlsx`);
}

function exportPrint(){
  const rows = getFilteredOrders();
  if(!rows.length){ showToast('لا توجد بيانات للطباعة'); return; }
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <h2>تقرير أوامر العمل — مطبعة النصر</h2>
    <div style="font-size:11px;margin-bottom:10px;">تاريخ التقرير: ${nowStamp()} — عدد الأوامر: ${rows.length}</div>
    <table>
      <thead><tr>
        <th>الرقم</th><th>النوع</th><th>العميل</th><th>الشغلانة</th><th>الكمية</th><th>الحالة</th><th>تاريخ التسليم</th>
      </tr></thead>
      <tbody>
        ${rows.map(o=>`<tr>
          <td>${escapeHtml(orderLabel(o))}</td>
          <td>${o.type==='plastic'?'بلاستيك':'ورقي'}</td>

          <td>${escapeHtml(o.workName||'—')}</td>
          <td>${escapeHtml(o.quantity||'—')}</td>

}

const notifiedOrderIds = new Set();

function requestNotifyPermission(){
  if(!('Notification' in window)){ showToast('المتصفح ده مايدعمش التنبيهات'); return; }
  if(Notification.permission === 'granted'){
    showToast('تنبيهات التأخير مفعّلة بالفعل');
    checkOverdueNotifications(true);
    return;
  }
  Notification.requestPermission().then(perm => {
    if(perm === 'granted'){
      showToast('تم تفعيل تنبيهات التأخير');
      checkOverdueNotifications(true);
    }else{
      showToast('تم رفض إذن التنبيهات من المتصفح');
    }
  });
}

function checkOverdueNotifications(force){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const overdueOrders = ORDERS.filter(o => isOverdue(o) && !o.paused);
  overdueOrders.forEach(o => {
    const key = o.type + '-' + o.id;
    if(force || !notifiedOrderIds.has(key)){
      notifiedOrderIds.add(key);
      try{
        new Notification('⚠ أمر عمل متأخر', {
          body: `${orderLabel(o)} — ${o.clientName||''} — موعد التسليم: ${o.deliveryDate||'—'}`,
          tag: key
        });
      }catch(e){}
    }
  });
}

function renderDashboard(){
  const el = document.getElementById('dashboardView');
  const visible = getFilteredOrders();
  const statusOptions = allStatusOptions();
  const toolbarHtml = `
    <div class="toolbar">
      <input type="text" placeholder="بحث بالاسم أو الشغلانة أو الرقم..." value="${escapeHtml(dashSearch)}" oninput="setDashSearch(this.value)">
      <select onchange="setDashStatus(this.value)">
        <option value="all">كل الحالات</option>
        ${statusOptions.map(([k,l])=>`<option value="${k}" ${dashStatusFilter===k?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="btn-export" onclick="exportExcel()">⬇ Excel</button>
      <button class="btn-export" onclick="exportPrint()">🖨 طباعة / PDF</button>
      <button class="btn-export" onclick="requestNotifyPermission()" id="notifyBtn">🔔 تنبيهات التأخير</button>
    </div>`;
  const filterHtml = `<div class="filter-row">
      <button class="${dashFilter==='all'?'active':''}" onclick="setFilter('all')">الكل</button>
      <button class="${dashFilter==='paper'?'active':''}" onclick="setFilter('paper')">ورقي</button>
      <button class="${dashFilter==='plastic'?'active':''}" onclick="setFilter('plastic')">بلاستيكي</button>
    </div>`;
  if(visible.length === 0){
    el.innerHTML = toolbarHtml + filterHtml + `<div id="empty">لا توجد أوامر عمل مطابقة.</div><div id="printArea"></div>`;
    return;
  }
  const sorted = [...visible].sort((a,b)=>b.id-a.id);
  el.innerHTML = toolbarHtml + filterHtml + `<div class="grid">` + sorted.map(o=>{
    const overdue = isOverdue(o);
    const stages = stagesFor(o.type);
    const stageIdx = stages.findIndex(s=>s.key===o.status);
    const dots = stages.map((s,i)=>`<span class="${i<=stageIdx ? s.dot : ''}"></span>`).join('');
    return `
      <div class="card ${o.type==='plastic'?'plastic':''}" onclick="openDetail('${o.type}',${o.id})">
        <div class="orderno mono"><span class="type-badge ${o.type==='plastic'?'plastic':''}">${o.type==='plastic'?'بلاستيك':'ورقي'}</span> ${orderLabelHtml(o)}</div>
        <div class="client">${escapeHtml(o.clientName||'—')}</div>
        <div class="work">${escapeHtml(o.workName||'—')} ${o.quantity?('· '+escapeHtml(o.quantity)):''}</div>
        <div class="cmyk-dots">${dots}</div>
        <div class="card-footer">
          <span class="status-pill">${escapeHtml(o.status)}</span>
          ${o.paused ? '<span class="overdue-badge" style="background:#c78a00;">⏸ متوقف</span>' : (overdue ? '<span class="overdue-badge">متأخر</span>' : (o.deliveryDate ? `<span class="mono">${escapeHtml(o.deliveryDate)}</span>` : ''))}
        </div>
      </div>`;
  }).join('') + `</div><div id="printArea"></div>`;
  checkOverdueNotifications();
}
function setFilter(f){ dashFilter = f; renderDashboard(); }

function handleImageUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingDesignImage = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('imgPreview').innerHTML = `<img src="${pendingDesignImage}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function attachPaperFormHandler(){
  document.getElementById('orderForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const getAll = name => fd.getAll(name);
    const get = name => fd.get(name) || '';
    if(!get('clientName').trim()){ showToast('اسم العميل مطلوب'); return; }

    const sameType = ORDERS.filter(o=>o.type==='paper');
    const nextId = sameType.length ? Math.max(...sameType.map(o=>o.id)) + 1 : 1;
    const order = {
      id: nextId, type:'paper',
      clientName: get('clientName'), clientType: get('clientType'),
      workType: get('workType'), workName: get('workName'), quantity: get('quantity'),
      finalSize: get('finalSize'), otherInfo: get('otherInfo'),

function attachPlasticFormHandler(){
  document.getElementById('orderForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const get = name => fd.get(name) || '';
    if(!get('clientName').trim()){ showToast('اسم العميل مطلوب'); return; }

    const items = [];
    document.querySelectorAll('#itemsBody tr').forEach((r,i)=>{
      const capacity = r.querySelector('.it-capacity').value;
      const qty = r.querySelector('.it-qty').value;
      const color = r.querySelector('.it-color').value;
      const notes = r.querySelector('.it-notes').value;
      if(capacity || qty || color || notes){
        items.push({no:String(i+1).padStart(2,'0'), capacity, qty, color, notes});
      }
    });

    const caps = [];
    document.querySelectorAll('#capsBody tr').forEach((r,i)=>{
      const color = r.querySelector('.cap-color').value;
      const qty = r.querySelector('.cap-qty').value;
      if(color || qty) caps.push({no:String(i+1).padStart(2,'0'), color, qty});
    });

    const sameType = ORDERS.filter(o=>o.type==='plastic');
    const nextId = sameType.length ? Math.max(...sameType.map(o=>o.id)) + 1 : 1;
    const order = {
      id: nextId, type:'plastic',
      clientName: get('clientName'), orderDate: get('orderDate'),
      items, caps, generalNote: get('generalNote'), designImage: pendingDesignImage,
      startDateTime: get('startDateTime'), endDateTime: get('endDateTime'),
      wasteQty: get('wasteQty'), technician: get('technician'),
      assistant1: get('assistant1'), assistant2: get('assistant2'),
      status: 'مستلم', createdAt: nowStamp(),
      history: [{ts: nowStamp(), event:'تم إنشاء أمر العمل', actor: getActor()}]
    };
    ORDERS.push(order);
    await saveOrders();
    showToast(`تم حفظ أمر العمل رقم ب#${nextId}`);
    pendingDesignImage = '';
    switchTab('dashboard');
  });
}

function openDetail(type, id){
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  if(!o) return;
  const stages = stagesFor(o.type);
  const stageIdx = stages.findIndex(s=>s.key===o.status);
  const pipeline = stages.map((s,i)=>{
    const cls = i<stageIdx ? 'done' : (i===stageIdx ? ('current '+(o.type==='plastic'?'plastic':'')) : '');
    return `<span class="stage ${cls}">${s.label}</span>`;
  }).join('<span class="arrow">←</span>');
  const overdue = isOverdue(o);
  const nextStage = stageIdx < stages.length-1 ? stages[stageIdx+1] : null;

  let bodyExtra = '';
  if(o.type === 'paper'){
    const detailRows = [
      ['نوع العميل', o.clientType], ['نوع العمل', o.workType],

      ['المقاس النهائي', o.finalSize], ['كمية الطباعة', o.printQty],

function closeDetail(){ document.getElementById('modalRoot').innerHTML = ''; }

async function updateProgress(type, id){
  const input = document.getElementById('progressInput_'+type+'_'+id);
  const val = input.value.trim();
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  if(!o) return;
  o.completedQty = val;
  const stages = stagesFor(type);
  const stageIdx = stages.findIndex(s=>s.key===o.status);
  o.history.push({ts: nowStamp(), event:`تحديث الكمية المنجزة في مرحلة "${stages[stageIdx]?stages[stageIdx].label:o.status}": ${val}`, actor: getActor()});
  await saveOrders();
  showToast('تم تحديث الكمية');
  openDetail(type, id);
  renderDashboard();
}
async function pauseOrder(type, id){
  const input = document.getElementById('pauseReasonInput_'+type+'_'+id);
  const reason = input.value.trim();
  if(!reason){ showToast('اكتب سبب الإيقاف'); return; }
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  if(!o) return;
  const stages = stagesFor(type);
  const stageIdx = stages.findIndex(s=>s.key===o.status);
  o.paused = true;
  o.pauseReason = reason;
  o.history.push({ts: nowStamp(), event:`تم الإيقاف المؤقت في مرحلة "${stages[stageIdx]?stages[stageIdx].label:o.status}" — السبب: ${reason}`, actor: getActor()});
  await saveOrders();
  showToast('تم إيقاف الأمر مؤقتًا');
  openDetail(type, id);
  renderDashboard();
}
async function resumeOrder(type, id){
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  if(!o) return;
  const stages = stagesFor(type);
  const stageIdx = stages.findIndex(s=>s.key===o.status);
  o.paused = false;
  o.history.push({ts: nowStamp(), event:`تم استئناف العمل في مرحلة "${stages[stageIdx]?stages[stageIdx].label:o.status}"`, actor: getActor()});
  o.pauseReason = '';
  await saveOrders();
  showToast('تم استئناف الأمر');
  openDetail(type, id);
  renderDashboard();
}

async function advanceStage(type, id){
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  if(!o) return;
  if(o.paused){ showToast('استأنف العمل أولًا قبل الانتقال للمرحلة التالية'); return; }
  const stages = stagesFor(type);
  const idx = stages.findIndex(s=>s.key===o.status);
  if(idx >= stages.length-1) return;
  const next = stages[idx+1];
  o.status = next.key;
  o.completedQty = '';
  o.history.push({ts: nowStamp(), event:`تم الانتقال إلى مرحلة: ${next.label}`, actor: getActor()});
  await saveOrders();
  showToast(`تم تحديث الحالة إلى: ${next.label}`);
  openDetail(type, id);
  renderDashboard();
}
async function addNote(type, id){
  const input = document.getElementById('noteInput_'+type+'_'+id);
  const text = input.value.trim();
  if(!text) return;
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  o.history.push({ts: nowStamp(), event:`ملاحظة: ${text}`, actor: getActor()});
  await saveOrders();
  input.value = '';
  openDetail(type, id);
}
async function deleteOrder(type, id){
  if(!confirm('هل تريد حذف أمر العمل هذا نهائيًا؟')) return;
  try{
    const table = type==='plastic' ? 'plastic_orders' : 'paper_orders';
    const {error} = await supabaseClient.from(table).delete().eq('id', id);
    if(error) throw error;
    if(type==='plastic'){
      const {error: logErr} = await supabaseClient.from('plastic_daily_log')
        .delete().eq('linked_type', 'plastic').eq('linked_id', String(id));
      if(logErr) throw logErr;
      DAILY = DAILY.filter(d => !(d.linkedType==='plastic' && String(d.linkedId)===String(id)));
    }
  }catch(e){ showToast('خطأ في الحذف: ' + e.message); return; }
  ORDERS = ORDERS.filter(x=>!(x.type===type && x.id===id));
  closeDetail();
  renderDashboard();
  showToast('تم حذف أمر العمل وسجلات المتابعة المرتبطة به');
}
function copyAlert(type, id){
  const o = ORDERS.find(x=>x.type===type && x.id===id);
  const overdue = isOverdue(o);
  let msg = `تنبيه أمر عمل ${orderLabel(o)}\nالعميل: ${o.clientName}\n${o.type==='paper' ? ('الشغلانة: '+(o.workName||'—')+'\n') : ''}الحالة الحالية: ${o.status}\n`;
  if(o.deliveryDate) msg += `تاريخ التسليم: ${o.deliveryDate}\n`;
  if(overdue) msg += `⚠ الأمر متأخر عن الموعد، برجاء المتابعة فورًا.\n`;
  msg += `تم الإرسال بواسطة: ${getActor()} — ${nowStamp()}`;
  const ta = document.createElement('textarea');
  ta.value = msg;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); showToast('تم نسخ رسالة التنبيه، الصقها في واتساب'); }
  catch(e){ showToast('تعذر النسخ التلقائي، انسخ النص يدويًا'); }
  document.body.removeChild(ta);
}

function previewLinkedOrder(){
  const val = document.getElementById('linkedOrderIdInput').value.trim();
  const preview = document.getElementById('linkedOrderPreview');
  if(!val){ preview.textContent = ''; return; }
  const match = ORDERS.find(o => o.type==='plastic' && String(o.id)===String(val));
  if(match){
    preview.textContent = `✓ مرتبط بأمر ب#${match.id} — ${match.clientName}`;
    preview.style.color = 'var(--good)';
  }else{
    preview.textContent = '⚠ لا يوجد أمر عمل بلاستيك بهذا الرقم';
    preview.style.color = 'var(--warn)';
  }
}

      <td class="mono">${escapeHtml(d.date)}</td>
      <td>${escapeHtml(d.workerName)}</td>
      <td>${tags||'—'}</td>
      <td>${escapeHtml(d.quantity||'—')}</td>
      <td>${escapeHtml(d.defects||'—')}</td>
      <td>${escapeHtml(d.client||'—')}</td>
      <td class="mono">${linkLabel}</td>
    </tr>`;
  }).join('');
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'inline-block';
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
  showToast('تم تثبيت التطبيق بنجاح');
});
function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
async function triggerInstall(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
    return;
  }
  if(isIos()){
    showToast('من متصفح Safari: اضغط زر المشاركة ⬆️ ثم "إضافة إلى الشاشة الرئيسية"');
    return;
  }
  showToast('التطبيق مثبّت بالفعل أو غير متاح للتثبيت حاليًا من هذا المتصفح');
}

(async function init(){
  if(isIos() && !isStandalone()){
    const btn = document.getElementById('installBtn');
    if(btn){ btn.style.display = 'inline-block'; btn.textContent = '📲 كيفية التثبيت'; }
  }
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){}
  }
  await loadEmployees();
  populateLoginSelect();
  const autoLoggedIn = await tryAutoLogin();
  if(!autoLoggedIn){
    document.getElementById('loginOverlay').style.display = 'flex';
  }
})();
</script>
